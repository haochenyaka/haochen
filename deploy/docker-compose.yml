name: haochen

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haochen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haochen}
      POSTGRES_DB: ${POSTGRES_DB:-haochen}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haochen} -d ${POSTGRES_DB:-haochen}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-haochen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-haochen-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus:
    # 2.5.x：原生 BM25 稀疏向量（Function + hybrid search），检索的宽捞腿依赖该能力
    image: milvusdb/milvus:v2.5.6
    profiles: ["knowledge"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  neo4j:
    image: neo4j:5-community
    profiles: ["knowledge"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-haochen-dev-secret}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-haochen-dev-secret} 'RETURN 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  bge-embed:
    # 本地 BGE-M3：OpenAI 兼容端点 /v1/embeddings。模型目录先由 prepare_bge_models.py 准备
    image: ${BGE_EMBED_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    profiles: ["knowledge"]
    command:
      [
        "--model-id",
        "/models/bge-m3",
        "--pooling",
        "cls",
        "--auto-truncate",
        "--tokenization-workers",
        "2",
        "--max-batch-tokens",
        "4096",
        # 与后端 EMBED_BATCH_SIZE / 召回上限对齐，TEI 默认也是 32
        "--max-client-batch-size",
        "32",
      ]
    volumes:
      - ${BGE_MODELS_DIR:-./models}:/models:ro
    mem_limit: 4600m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  bge-rerank:
    # CPU 下真实分块重排需 53-59s/23 候选（见 docs/spikes），默认不随 knowledge profile 启动；
    # 仅 GPU 或小模型验证通过后，用 --profile bge-rerank 显式启用
    image: ${BGE_RERANK_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    profiles: ["bge-rerank"]
    command:
      [
        "--model-id",
        "/models/bge-reranker-v2-m3",
        "--auto-truncate",
        "--tokenization-workers",
        "2",
        "--max-batch-tokens",
        "4096",
        "--max-client-batch-size",
        "32",
      ]
    volumes:
      - ${BGE_MODELS_DIR:-./models}:/models:ro
    mem_limit: 4600m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  device-sim:
    build: ../backend
    command: ["uvicorn", "app.device_sim.main:app", "--host", "0.0.0.0", "--port", "9100"]
    environment:
      DEVICE_SIM_SIGNING_SECRET: ${DEVICE_SIM_SIGNING_SECRET:-dev-signing-secret}
    ports:
      - "9100:9100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9100/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  # MCP 网关：把内部渠道（门锁/机器人/微信）以远程 MCP（streamable_http）暴露给 Agent。
  # 子路径：/lock/mcp、/robot/mcp、/wechat/mcp；seed 已预置三条 mcp_servers 记录。
  # 工具内部走 device-sim 契约模拟器，业务服务与失败语义不变。
  mcp-gateway:
    build: ../backend
    command: ["uvicorn", "app.mcp_gateway.main:app", "--host", "0.0.0.0", "--port", "9200"]
    environment:
      DEVICE_SIM_BASE_URL: http://device-sim:9100
      LOCK_MASTER_KEY: ${LOCK_MASTER_KEY:-change-me}
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9200/healthz')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      device-sim:
        condition: service_healthy

  api:
    build: ../backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-haochen}:${POSTGRES_PASSWORD:-haochen}@postgres:5432/${POSTGRES_DB:-haochen}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-haochen}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-haochen-dev-secret}
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-haochen-dev-secret}
      DEVICE_SIM_BASE_URL: http://device-sim:9100
      LOCK_MASTER_KEY: ${LOCK_MASTER_KEY:-change-me}
      # 开发态身份请求头：默认关闭；本地联调如需启用显式设为 true
      DEV_IDENTITY_ENABLED: ${DEV_IDENTITY_ENABLED:-false}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-${DEEP_SEEK_API_KEY:-}}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.2}
      # 知识库检索：空值回退 dev 确定性实现；启用本地 BGE 时指向 bge-embed
      MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      KB_RERANK_ENABLED: ${KB_RERANK_ENABLED:-false}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL_NAME: ${RERANK_MODEL_NAME:-bge-reranker-v2-m3}
      # 关系图补充腿：命中结构化问题才查 Neo4j，故障/超时自动降级
      KB_GRAPH_ENABLED: ${KB_GRAPH_ENABLED:-true}
      KB_GRAPH_TIMEOUT_SECONDS: ${KB_GRAPH_TIMEOUT_SECONDS:-3}
      WECHAT_PAY_MCHID: ${WECHAT_PAY_MCHID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_CERT_SERIAL: ${WECHAT_PAY_CERT_SERIAL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_SELF_HOSTED: ${LANGFUSE_SELF_HOSTED:-false}
      LANGFUSE_ALLOW_EXTERNAL_EXPORT: ${LANGFUSE_ALLOW_EXTERNAL_EXPORT:-false}
      # P4.3 告警阈值（端点只读事实按阈值判定；0 或负数按配置校验由部署方负责）
      ALERT_PENDING_STUCK_SECONDS: ${ALERT_PENDING_STUCK_SECONDS:-300}
      ALERT_RUNNING_STUCK_SECONDS: ${ALERT_RUNNING_STUCK_SECONDS:-180}
      ALERT_LEASE_WINDOW_MINUTES: ${ALERT_LEASE_WINDOW_MINUTES:-15}
      ALERT_LEASE_EXPIRY_RATE: ${ALERT_LEASE_EXPIRY_RATE:-0.05}
      ALERT_LEASE_MIN_ATTEMPTS: ${ALERT_LEASE_MIN_ATTEMPTS:-10}
      ALERT_SSE_WINDOW_MINUTES: ${ALERT_SSE_WINDOW_MINUTES:-15}
      ALERT_SSE_DISCONNECT_RATE: ${ALERT_SSE_DISCONNECT_RATE:-0.1}
      ALERT_SSE_MIN_STREAMS: ${ALERT_SSE_MIN_STREAMS:-20}
      ALERT_DB_POOL_USAGE: ${ALERT_DB_POOL_USAGE:-0.9}
      # P4.4 容量：checkpoint 连接池、历史加载上限、审计合并窗口
      CHECKPOINT_POOL_MIN_SIZE: ${CHECKPOINT_POOL_MIN_SIZE:-1}
      CHECKPOINT_POOL_MAX_SIZE: ${CHECKPOINT_POOL_MAX_SIZE:-4}
      CHECKPOINT_POOL_OPEN_TIMEOUT_SECONDS: ${CHECKPOINT_POOL_OPEN_TIMEOUT_SECONDS:-10}
      MESSAGE_HISTORY_LIMIT: ${MESSAGE_HISTORY_LIMIT:-200}
      SUMMARY_THRESHOLD: ${SUMMARY_THRESHOLD:-24000}
      AUDIT_BATCH_WINDOW_MS: ${AUDIT_BATCH_WINDOW_MS:-5}
      AUDIT_BATCH_MAX_FACTS: ${AUDIT_BATCH_MAX_FACTS:-32}
    volumes:
      - workdirdata:/srv/app/data/workdir
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      device-sim:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ../backend
    command:
      [
        "arq",
        "--custom-log-dict",
        "app.worker.settings.WORKER_LOG_CONFIG",
        "app.worker.settings.WorkerSettings",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-haochen}:${POSTGRES_PASSWORD:-haochen}@postgres:5432/${POSTGRES_DB:-haochen}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-haochen}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-haochen-dev-secret}
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-haochen-dev-secret}
      DEVICE_SIM_BASE_URL: http://device-sim:9100
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-${DEEP_SEEK_API_KEY:-}}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.2}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_SELF_HOSTED: ${LANGFUSE_SELF_HOSTED:-false}
      LANGFUSE_ALLOW_EXTERNAL_EXPORT: ${LANGFUSE_ALLOW_EXTERNAL_EXPORT:-false}
      MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      KB_RERANK_ENABLED: ${KB_RERANK_ENABLED:-false}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL_NAME: ${RERANK_MODEL_NAME:-bge-reranker-v2-m3}
      # 关系图补充腿：命中结构化问题才查 Neo4j，故障/超时自动降级
      KB_GRAPH_ENABLED: ${KB_GRAPH_ENABLED:-true}
      KB_GRAPH_TIMEOUT_SECONDS: ${KB_GRAPH_TIMEOUT_SECONDS:-3}
      # P4.4 容量：Run 在 worker 执行，checkpoint 池与上下文/审计窗口在此生效
      CHECKPOINT_POOL_MIN_SIZE: ${CHECKPOINT_POOL_MIN_SIZE:-1}
      CHECKPOINT_POOL_MAX_SIZE: ${CHECKPOINT_POOL_MAX_SIZE:-4}
      CHECKPOINT_POOL_OPEN_TIMEOUT_SECONDS: ${CHECKPOINT_POOL_OPEN_TIMEOUT_SECONDS:-10}
      MESSAGE_HISTORY_LIMIT: ${MESSAGE_HISTORY_LIMIT:-200}
      SUMMARY_THRESHOLD: ${SUMMARY_THRESHOLD:-24000}
      AUDIT_BATCH_WINDOW_MS: ${AUDIT_BATCH_WINDOW_MS:-5}
      AUDIT_BATCH_MAX_FACTS: ${AUDIT_BATCH_MAX_FACTS:-32}
      # P4.5 隐私告知版本：同意记录必须与该版本一致，否则客户端需要重新展示告知
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-2026-10-18}
    volumes:
      - workdirdata:/srv/app/data/workdir
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      device-sim:
        condition: service_started
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # 后台任务 worker：独立队列与独立槽位（ARQ_MAX_JOBS），长知识任务不占 AgentRun 容量
  task-worker:
    build: ../backend
    command:
      [
        "arq",
        "--custom-log-dict",
        "app.worker.settings.WORKER_LOG_CONFIG",
        "app.worker.settings.TaskWorkerSettings",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-haochen}:${POSTGRES_PASSWORD:-haochen}@postgres:5432/${POSTGRES_DB:-haochen}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-haochen}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-haochen-dev-secret}
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-haochen-dev-secret}
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-4}
      DEVICE_SIM_BASE_URL: http://device-sim:9100
      LOCK_MASTER_KEY: ${LOCK_MASTER_KEY:-change-me}
      # 订阅消息模板（入住通知第二通道）：空 = 未配置，跳过下发并在订单事件留痕
      WECHAT_SUBSCRIBE_TEMPLATE_ID: ${WECHAT_SUBSCRIBE_TEMPLATE_ID:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-${DEEP_SEEK_API_KEY:-}}
      MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      KB_RERANK_ENABLED: ${KB_RERANK_ENABLED:-false}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL_NAME: ${RERANK_MODEL_NAME:-bge-reranker-v2-m3}
      # 关系图补充腿：命中结构化问题才查 Neo4j，故障/超时自动降级
      KB_GRAPH_ENABLED: ${KB_GRAPH_ENABLED:-true}
      KB_GRAPH_TIMEOUT_SECONDS: ${KB_GRAPH_TIMEOUT_SECONDS:-3}
    volumes:
      - workdirdata:/srv/app/data/workdir
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.settings.TaskWorkerSettings"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # 定时逻辑备份：默认每天一次，本地保留 30 天；配置 OFFSITE_BACKUP_DIR 后同时写异地副本。
  # 生产叠加 docker-compose.prod.yml 后强制要求加密密钥与异地目录。
  backup:
    image: ${BACKUP_IMAGE:-postgres:16}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-haochen}
      DB_PASS: ${POSTGRES_PASSWORD:-haochen}
      DB_NAME: ${POSTGRES_DB:-haochen}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_REQUIRE_ENCRYPTION: ${BACKUP_REQUIRE_ENCRYPTION:-false}
      OFFSITE_BACKUP_DIR: /offsite
      BACKUP_REQUIRE_OFFSITE: ${BACKUP_REQUIRE_OFFSITE:-false}
    volumes:
      - ./backup.sh:/usr/local/bin/haochen-backup.sh:ro
      - backupdata:/backups
      - ${OFFSITE_BACKUP_DIR:-./backups-offsite}:/offsite
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          bash /usr/local/bin/haochen-backup.sh || echo "[backup] 本次备份失败，等待下一周期" >&2
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done

volumes:
  pgdata:
  redisdata:
  miniodata:
  milvusdata:
  neo4jdata:
  backupdata:
  workdirdata:
