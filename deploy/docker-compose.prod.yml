# 生产覆盖层：与 docker-compose.yml 叠加使用
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# 中间件与 API 一律不发布宿主端口，仅 nginx 暴露 80/443。
name: haochen

services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产环境必须显式设置 POSTGRES_PASSWORD}

  redis:
    ports: !override []

  minio:
    ports: !override []
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?生产环境必须显式设置 MINIO_ROOT_PASSWORD}

  milvus:
    ports: !override []

  neo4j:
    ports: !override []
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?生产环境必须显式设置 NEO4J_PASSWORD}

  device-sim:
    ports: !override []

  api:
    ports: !override []
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-haochen}:${POSTGRES_PASSWORD:?生产环境必须显式设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-haochen}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?生产环境必须显式设置 MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?生产环境必须显式设置 MINIO_ROOT_PASSWORD}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?生产环境必须显式设置 NEO4J_PASSWORD}
      DEVICE_SIM_SIGNING_SECRET: ${DEVICE_SIM_SIGNING_SECRET:?生产环境必须显式设置 DEVICE_SIM_SIGNING_SECRET}
      LOCK_MASTER_KEY: ${LOCK_MASTER_KEY:?生产环境必须显式设置 LOCK_MASTER_KEY}
      DEV_IDENTITY_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?生产环境必须显式设置 CORS_ORIGINS（JSON 数组）}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_TENANT_ID: ${RATE_LIMIT_TENANT_ID:-haochen}
      RATE_LIMIT_TRUST_FORWARDED_FOR: "true"

  worker:
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-haochen}:${POSTGRES_PASSWORD:?生产环境必须显式设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-haochen}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?生产环境必须显式设置 MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?生产环境必须显式设置 MINIO_ROOT_PASSWORD}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?生产环境必须显式设置 NEO4J_PASSWORD}
      DEVICE_SIM_SIGNING_SECRET: ${DEVICE_SIM_SIGNING_SECRET:?生产环境必须显式设置 DEVICE_SIM_SIGNING_SECRET}

  task-worker:
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-haochen}:${POSTGRES_PASSWORD:?生产环境必须显式设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-haochen}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?生产环境必须显式设置 MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?生产环境必须显式设置 MINIO_ROOT_PASSWORD}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?生产环境必须显式设置 NEO4J_PASSWORD}
      DEVICE_SIM_SIGNING_SECRET: ${DEVICE_SIM_SIGNING_SECRET:?生产环境必须显式设置 DEVICE_SIM_SIGNING_SECRET}
      LOCK_MASTER_KEY: ${LOCK_MASTER_KEY:?生产环境必须显式设置 LOCK_MASTER_KEY}

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:?生产环境必须显式设置 SERVER_NAME}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # 清空镜像自带的 default.conf，避免未知 Host 命中默认欢迎页
      - ./nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
