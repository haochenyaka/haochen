name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy app
      - name: Unit tests
        run: pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haochen
          POSTGRES_PASSWORD: haochen
          POSTGRES_DB: haochen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haochen -d haochen"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://haochen:haochen@localhost:5432/haochen
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: haochen
      MINIO_SECRET_KEY: haochen-dev-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migration upgrade head
        run: alembic upgrade head
      - name: Migration downgrade base
        run: alembic downgrade base
      - name: Migration upgrade head again
        run: alembic upgrade head
      # 不启 MinIO：dockerhub 的 minio/minio 已不可匿名拉取（pull access denied），
      # 且报表/健康面板用例在数据湖不可达时按契约降级回 PostgreSQL，这里正是跑这条路径。
      - name: Integration tests
        run: pytest -q -m integration

  # 真实执行 deploy/backup.sh 与 deploy/restore.sh：加密、异地副本、丢表后恢复到新库。
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haochen
          POSTGRES_PASSWORD: haochen
          POSTGRES_DB: haochen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haochen -d haochen"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Seed drill data
        env:
          PGPASSWORD: haochen
        run: |
          set -euo pipefail
          psql -h localhost -U haochen -d haochen -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE rooms (id serial PRIMARY KEY, room_no text NOT NULL);
          CREATE TABLE orders (id serial PRIMARY KEY, order_no text NOT NULL);
          CREATE TABLE messages (id serial PRIMARY KEY, content text NOT NULL);
          CREATE TABLE agent_runs (id serial PRIMARY KEY, status text NOT NULL);
          INSERT INTO rooms (room_no) VALUES ('A-1'), ('A-2');
          INSERT INTO orders (order_no) VALUES ('NO-1');
          INSERT INTO messages (content) VALUES ('你好'), ('退房');
          INSERT INTO agent_runs (status) VALUES ('succeeded');
          SQL
      - name: Run backup with encryption, offsite copy and retention
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: haochen
          DB_PASS: haochen
          DB_NAME: haochen
          BACKUP_DIR: ${{ runner.temp }}/backups
          OFFSITE_BACKUP_DIR: ${{ runner.temp }}/offsite
          BACKUP_ENCRYPTION_KEY: ci-only-backup-key-0123456789
          BACKUP_REQUIRE_ENCRYPTION: "true"
          BACKUP_REQUIRE_OFFSITE: "true"
          BACKUP_RETENTION_DAYS: "30"
        run: |
          set -euo pipefail
          mkdir -p "${BACKUP_DIR}" "${OFFSITE_BACKUP_DIR}"
          touch -d "40 days ago" "${BACKUP_DIR}/haochen_expired.dump.gz" "${OFFSITE_BACKUP_DIR}/haochen_expired.dump.gz"
          bash deploy/backup.sh
          test -f "${BACKUP_DIR}/manifest.txt"
          ARCHIVE="$(find "${BACKUP_DIR}" -maxdepth 1 -name 'haochen_*.dump.gz.enc' | head -1)"
          test -n "${ARCHIVE}"
          test -f "${ARCHIVE}.sha256"
          test -f "${OFFSITE_BACKUP_DIR}/$(basename "${ARCHIVE}")"
          test ! -e "${BACKUP_DIR}/haochen_expired.dump.gz"
          test ! -e "${OFFSITE_BACKUP_DIR}/haochen_expired.dump.gz"
      - name: Simulate data loss and restore to a new database
        env:
          PGPASSWORD: haochen
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: haochen
          DB_PASS: haochen
          DB_NAME: haochen
          BACKUP_ENCRYPTION_KEY: ci-only-backup-key-0123456789
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          set -euo pipefail
          psql -h localhost -U haochen -d haochen -v ON_ERROR_STOP=1 \
            -c "DROP TABLE rooms, orders, messages, agent_runs CASCADE"
          ARCHIVE="$(find "${BACKUP_DIR}" -maxdepth 1 -name 'haochen_*.dump.gz.enc' | head -1)"
          bash deploy/restore.sh "${ARCHIVE}" haochen_restore --yes
          psql -h localhost -U haochen -d haochen_restore -tAc "SELECT count(*) FROM rooms" | grep -qx 2
          psql -h localhost -U haochen -d haochen_restore -tAc "SELECT count(*) FROM messages" | grep -qx 2

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml --profile knowledge config --quiet
      - name: Validate production compose override
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          MINIO_ROOT_PASSWORD: ci-only-minio-password
          NEO4J_PASSWORD: ci-only-neo4j-password
          LOCK_MASTER_KEY: ci-only-lock-master-key-0123456789
          DEVICE_SIM_SIGNING_SECRET: ci-only-device-sim-secret
          CORS_ORIGINS: '["https://admin.example.com"]'
          SERVER_NAME: hotel.example.com
          BACKUP_ENCRYPTION_KEY: ci-only-backup-key-0123456789
          OFFSITE_BACKUP_DIR: /ci/offsite
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [guest-miniapp, staff-miniapp, admin-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Build WeChat miniprogram
        if: matrix.app != 'admin-web'
        run: npm run build:mp-weixin
