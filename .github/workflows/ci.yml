name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy app
      - name: Unit tests
        run: pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haochen
          POSTGRES_PASSWORD: haochen
          POSTGRES_DB: haochen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haochen -d haochen"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://haochen:haochen@localhost:5432/haochen
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: haochen
      MINIO_SECRET_KEY: haochen-dev-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migration upgrade head
        run: alembic upgrade head
      - name: Migration downgrade base
        run: alembic downgrade base
      - name: Migration upgrade head again
        run: alembic upgrade head
      # 报表/健康面板用例会先探数据湖（MinIO），需 localhost:9000 可达方可降级回 PG 重算。
      # 官方 minio/minio 默认命令只打印用法即退出，无法作为 service 容器（不能覆盖启动命令），故用 docker run。
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=haochen \
            -e MINIO_ROOT_PASSWORD=haochen-dev-secret \
            minio/minio:RELEASE.2024-12-18T13-15-44Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become ready"
          docker logs minio
          exit 1
      - name: Integration tests
        run: pytest -q -m integration

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml --profile knowledge config --quiet

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [guest-miniapp, staff-miniapp, admin-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Build WeChat miniprogram
        if: matrix.app != 'admin-web'
        run: npm run build:mp-weixin
