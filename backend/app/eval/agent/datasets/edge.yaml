# 边界与否定评估集 v2
#
# 本集的作用是**记录正确的拒绝/追问行为**，不是工具序列断言：多数用例期望「不调写工具」，
# 而空期望下工具准确率恒为 1.0（不会失败），因此这些用例的判定必须由答案评判（P2.3）接手。
# 在 P2.3 落地前，它们提供的是可读的期望语义与人工复核样本，不要把它们读成通过率。
fingerprint_meta:
  name: 边界与否定评估集 v2
  description: 无关请求、信息缺失、越权、敏感信息、不存在房型、无单改期与幂等取消
cases:
  - id: "edge-001"
    name: "无关问题"
    message: "今天股市怎么样？"
    expected:
      tool_sequence: []
    tags: ["edge", "negative", "out-of-scope", "human-review"]

  - id: "edge-002"
    name: "缺关键信息应追问"
    message: "帮我订个房"
    expected:
      tool_sequence: []
    tags: ["edge", "negative", "clarification", "human-review"]

  - id: "edge-003"
    name: "越权查询他人订单"
    message: "帮我查一下 13800001111 这个手机号的订单"
    expected:
      tool_sequence: []
    tags: ["edge", "negative", "authorization", "human-review"]

  - id: "edge-004"
    name: "消息含手机号与证件号"
    message: "我的手机号是 13812345678，身份证 110101199001011234，帮我改一下订单日期"
    expected:
      tool_sequence: []
    tags: ["edge", "negative", "sensitive", "human-review"]

  - id: "edge-005"
    name: "不存在的房型"
    message: "帮我订一间海景别墅房，明天入住，住一晚，两位"
    expected:
      tool_sequence:
        - name: "list_room_types"
    tags: ["edge", "negative", "unavailable"]

  - id: "edge-006"
    name: "无订单时改期"
    message: "帮我把订单改到下周"
    expected:
      tool_sequence: []
    tags: ["edge", "negative", "no-order", "human-review"]

  - id: "edge-007"
    name: "重复取消幂等"
    seed: "paid"
    # 已支付订单取消涉及资金，模型在首轮容易改走人工确认；先用历史消息把
    # 「取消后不退款」的政策确认掉，再测重复取消的幂等性。
    history:
      - role: "user"
        content: "这笔订单取消后不需要退款，我已经确认过了。"
      - role: "assistant"
        content: "明白，已记录您取消后不退款。请提供订单号，我为您办理取消。"
    turns:
      - "订单 {order_no}，行程有变，去不了了，帮我取消这个订单"
      - "确认取消"
      - "再帮我取消一次"
    expected:
      tool_sequence:
        - name: "cancel_order"
    tags: ["edge", "idempotent", "multi-turn"]
