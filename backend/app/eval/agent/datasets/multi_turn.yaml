# 多轮语境评估集 v1
#
# 这些用例检验的是**跨轮语境**（指代、信息补全、改主意、连续追问），与 orders.yaml 的
# 有状态多轮互补：这里不依赖第一轮产生的业务数据，只看上下文是否被正确承接。
# 每轮一个 Run，工具序列按轮序聚合——所以 multi-006 的期望是两次 query_kb。
fingerprint_meta:
  name: 多轮语境评估集 v1
  description: 指代消解、信息补全、改主意与连续追问
cases:
  - id: "multi-001"
    name: "指代消解后下单"
    turns:
      - "你们有哪些房型？"
      - "就订那间大床房，今晚一晚"
    expected:
      tool_sequence:
        - name: "list_room_types"
        - name: "create_order"
      task_success: true
    tags: ["multi-turn", "coreference"]

  - id: "multi-002"
    name: "补充信息后下单"
    turns:
      - "我要订房"
      - "大床房，10月20日入住，10月22日退房"
    expected:
      tool_sequence:
        - name: "create_order"
      task_success: true
    tags: ["multi-turn", "clarification"]

  - id: "multi-003"
    name: "先比价再下单"
    turns:
      - "有便宜点的房型吗？"
      - "那就订最便宜的那个，今晚一晚"
    expected:
      tool_sequence:
        - name: "list_room_types"
        - name: "create_order"
      task_success: true
    tags: ["multi-turn", "coreference"]

  - id: "multi-004"
    name: "澄清入住人数"
    turns:
      - "我想订房"
      - "我们两个人，大床房，今晚一晚"
    expected:
      tool_sequence:
        - name: "create_order"
      task_success: true
    tags: ["multi-turn", "clarification"]

  - id: "multi-005"
    name: "跨轮改主意"
    turns:
      - "帮我订一间双床房，今晚一晚"
      - "算了，改成大床房"
    expected:
      tool_sequence:
        - name: "create_order"
        - name: "create_order"
      task_success: true
    tags: ["multi-turn", "change-of-mind"]

  - id: "multi-006"
    name: "连续知识追问"
    turns:
      - "早餐几点开始？"
      - "那午餐呢？"
    expected:
      tool_sequence:
        - name: "query_kb"
        - name: "query_kb"
      task_success: true
    tags: ["multi-turn", "knowledge"]
