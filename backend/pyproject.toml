[project]
name = "haochen-server"
version = "0.1.0"
description = "HaoChen 无人酒店 Agent 服务端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "langgraph~=1.0",
    "langchain-openai>=1.0",
    "langgraph-checkpoint<4.2",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "minio>=7.2",
    "pymilvus>=2.5,<2.6",
    "neo4j>=5.20",
    "pypdf>=5.0",
    "langfuse>=2.55,<3",
    "duckdb>=1.1",
    "pyarrow>=19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实 PostgreSQL / Redis / 外部服务的测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["app"]
